<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- LMNT Calculator app icon: a white droplet with an indigo lightning bolt
       on an indigo tile (final choice "A1 indigo"; see docs/icon-research/).
       Full-bleed square: iOS and Android cut their own corner shape. The drawing
       stays inside the central safe zone so it survives a maskable crop.
       Run `npm run icons` after changing this file to regenerate the PNG icons. -->
  <rect width="512" height="512" fill="#4f46e5"/>
  <g transform="scale(5.12)">
    <path d="M50 16 C50 16 26 44 26 60 a24 24 0 0 0 48 0 C74 44 50 16 50 16Z" fill="#ffffff"/>
    <polygon points="54,36 40,62 50,62 46,78 62,52 52,52" fill="#4f46e5"/>
  </g>
</svg>
